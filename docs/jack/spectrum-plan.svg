<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" width="1120" height="420" role="img" aria-label="Frequency plan"><title>Frequency plan</title><rect width="1120" height="420" rx="14" fill="#EDEDE8"/><text x="32" y="44" font-size="22" fill="#1A1A1A" font-weight="800" text-anchor="start" style="font-family:Barlow,'Helvetica Neue',Arial,sans-serif" >Where the codes live in the spectrum</text><text x="32" y="70" font-size="14" fill="#8C8C88" font-weight="600" text-anchor="start" style="font-family:Barlow,'Helvetica Neue',Arial,sans-serif" >48 kHz sampling: everything up to 24 kHz is on the wire. Whisper only keeps what is below 8 kHz.</text><rect x="63.4" y="110" width="336.6" height="220" fill="#1A1A1A" opacity="0.08"/><text x="230.0" y="132" font-size="12" fill="#1A1A1A" font-weight="800" text-anchor="middle" style="font-family:Barlow,'Helvetica Neue',Arial,sans-serif" >VOICE KEPT BY WHISPER (16 kHz audio)</text><rect x="564.0" y="110" width="309.5" height="220" fill="#F05A28" opacity="0.12"/><text x="718.75" y="128" font-size="12" fill="#F05A28" font-weight="800" text-anchor="middle" style="font-family:Barlow,'Helvetica Neue',Arial,sans-serif" >FXMIC CODES 12-19 kHz</text><line x1="897.25" y1="104" x2="897.25" y2="330" stroke="#E3242B" stroke-dasharray="4 4" stroke-width="2"/><text x="903.25" y="160" font-size="12" fill="#E3242B" font-weight="700" text-anchor="start" style="font-family:Barlow,'Helvetica Neue',Arial,sans-serif" >dongle</text><text x="903.25" y="176" font-size="12" fill="#E3242B" font-weight="700" text-anchor="start" style="font-family:Barlow,'Helvetica Neue',Arial,sans-serif" >roll-off</text><text x="903.25" y="192" font-size="12" fill="#E3242B" font-weight="700" text-anchor="start" style="font-family:'IBM Plex Mono',Menlo,monospace" >19.7 kHz</text><line x1="570.0" y1="330" x2="570.0" y2="260" stroke="#F05A28" stroke-width="4" stroke-linecap="round"/><line x1="697.5" y1="330" x2="697.5" y2="260" stroke="#F05A28" stroke-width="4" stroke-