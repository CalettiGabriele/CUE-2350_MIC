<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" width="1120" height="330" role="img" aria-label="Jack channel pipeline"><title>Jack channel pipeline</title><rect width="1120" height="330" rx="14" fill="#EDEDE8"/><text x="32" y="44" font-size="22" fill="#1A1A1A" font-weight="800" text-anchor="start" style="font-family:Barlow,'Helvetica Neue',Arial,sans-serif" >From a button press to a gesture on the Mac</text><text x="32" y="70" font-size="14" fill="#8C8C88" font-weight="600" text-anchor="start" style="font-family:Barlow,'Helvetica Neue',Arial,sans-serif" >One audio wire, one direction: the mic speaks, the Mac listens.</text><rect x="32" y="120" width="118" height="96" rx="10" fill="#fff" stroke="#F05A28" stroke-width="2"/><text x="91.0" y="150" font-size="13" fill="#F05A28" font-weight="800" text-anchor="middle" style="font-family:Barlow,'Helvetica Neue',Arial,sans-serif" >Button / handle</text><text x="91.0" y="176" font-size="11" fill="#1A1A1A" font-weight="500" text-anchor="middle" style="font-family:'IBM Plex Mono',Menlo,monospace" >press, release,</text><text x="91.0" y="194" font-size="11" fill="#1A1A1A" font-weight="500" text-anchor="middle" style="font-family:'IBM Plex Mono',Menlo,monospace" >shaker</text><path d="M152 168 h12" stroke="#8C8C88" stroke-width="2"/><path d="M164 163 l6 5 l-6 5 z" fill="#8C8C88"/><rect x="168" y="120" width="118" height="96" rx="10" fill="#fff" stroke="#F05A28" stroke-width="2"/><text x="227.0" y="150" font-size="13" fill="#F05A28" font-weight="800" text-anchor="middle" style="font-family:Barlow,'Helvetica Neue',Arial,sans-serif" >FXMic firmware</text><text x="227.0" y="176" font-size="11" fill="#1A1A1A" font-weight="500" text-anchor="middle" style="font-family:'IBM Plex Mono',Menlo,monospace" >gesture recognizer</text><text x="227.0" y="194" font-size="11" fill="#1A1A1A" font-weight="500" text-anchor="middle" style="font-family:'IBM Plex Mono',Menlo,monospace" >16 ms tick</text><path d="M288 168 h12" stroke="#8C8C88" stroke-width="2"/><path d="M300 163 l6 5 l-6 5 z" fill="#8C8C88"/><rect x="304" y="120" width="118" height="96" rx="10" fill="#fff" stroke="#F05A28" stroke-width="2"/><text x="363.0" y="150" font-size="13" fill="#F05A28" font-weight="800" text-anchor="middle" style="font-family:Barlow,'Helvetica Neue',Arial,sans-serif" >Code queue</text><text x="363.0" y="176" font-size="11" fill="#1A1A1A" font-weight="500" text-anchor="middle" style="font-family:'IBM Plex Mono',Menlo,monospace" >one code at a time</text><text x="363.0" y="194" font-size="11" fill="#1A1A1A" font-weight="500" text-anchor="middle" style="font-family:'IBM Plex Mono',Menlo,monospace" >3 symbols + gap</text><path d="M424 168 h12" stroke="#8C8C88" stroke-width="2"/><path d="M436 163 l6 5 l-6 5 z" fill="#8C8C88"/><rect x="440" y="120" width="118" height="96" rx="10" fill="#fff" stroke="#F05A28" stroke-width="2"/><text x="499.0" y="150" font-size="13" fill="#F05A28" font-weight="800" text-anchor="middle" style="font-family:Barlow,'Helvetica Neue',Arial,sans-serif" >Sampler</text><text x="499.0" y="176" font-size="11" fill="#1A1A1A" font-weight="500" text-anchor="middle" style="font-family:'IBM Plex Mono',Menlo,monospace" >4 two-tone WAVs</text><text x="499.0" y="194" font-size="11" fill="#1A1A1A" font-weight="500" text-anchor="middle" style="font-family:'IBM Plex Mono',Menlo,monospace" >in slots 0-3</text><path d="M560 168 h12" stroke="#8C8C88" stroke-width="2"/><path d="M572 163 l6 5 l-6 5 z" fill="#8C8C88"/><rect x="576" y="120" width="118" height="96" rx="10" fill="#fff" stroke="#1A1A1A" stroke-width="2"/><text x="635.0" y="150" font-size="13" fill="#1A1A1A" font-weight="800" text-anchor="middle" style="font-family:Barlow,'Helvetica Neue',Arial,sans-serif" >3.5 mm jack</text><text x="635.0" y="176" font-size="11" fill="#1A1A1A" font-weight="500" text-anchor="middle" style="font-family:'IBM Plex Mono',Menlo,monospace" >line out</text><text x="635.0" y="194" font-size="11" fill="#1A1A1A" font-weight="500" text-anchor="middle" style="font-family:'IBM Plex Mono',Menlo,monospace" >voice + codes</text><path d="M696 168 h12" stroke="#8C8C88" stroke-width="2"/><path d="M708 163 l6 5 l-6 5 z" fill="#8C8C88"/><rect x="712" y="120" width="118" height="96" rx="10" fill="#fff" stroke="#1A1A1A" stroke-width="2"/><text x="771.0" y="150" font-size="13" fill="#1A1A1A" font-weight="800" text-anchor="middle" style="font-family:Barlow,'Helvetica Neue',Arial,sans-serif" >USB-C dongle</text><text x="771.0" y="176" font-size="11" fill="#1A1A1A" font-weight="500" text-anchor="middle" style="font-family:'IBM Plex Mono',Menlo,monospace" >48 kHz input</text><text x="771.0" y="194" font-size="11" fill="#1A1A1A" font-weight="500" text-anchor="middle" style="font-family:'IBM Plex Mono',Menlo,monospace" >flat to 19.7 kHz</text><path d="M832 168 h12" stroke="#8C8C88" stroke-width="2"/><path d="M844 163 l6 5 l-6 5 z" fill="#8C8C88"/><rect x="848" y="120" width="118" height="96" rx="10" fill="#fff" stroke="#1A1A1A" stroke-width="2"/><text x="907.0" y="150" font-size="13" fill="#1A1A1A" font-weight="800" text-anchor="middle" style="font-family:Barlow,'Helvetica Neue',Arial,sans-serif" >Goertzel decoder</text><text x="907.0" y="176" font-size="11" fill="#1A1A1A" font-weight="500" text-anchor="middle" style="font-family:'IBM Plex Mono',Menlo,monospace" >8 tones, 20 ms</text><text x="907.0" y="194" font-size="11" fill="#1A1A1A" font-weight="500" text-anchor="middle" style="font-family:'IBM Plex Mono',Menlo,monospace" >every 10 ms</text><path d="M968 168 h12" stroke="#8C8C88" stroke-width="2"/><path d="M980 163 l6 5 l-6 5 z" fill="#8C8C88"/><rect x="984" y="120" width="118" height="96" rx="10" fill="#fff" stroke="#1A1A1A" stroke-width="2"/><text x="1043.0" y="150" font-size="13" fill="#1A1A1A" font-weight="800" text-anchor="middle" style="font-family:Barlow,'Helvetica Neue',Arial,sans-serif" >Gesture</text><text x="1043.0" y="176" font-size="11" fill="#1A1A1A" font-weight="500" text-anchor="middle" style="font-family:'IBM Plex Mono',Menlo,monospace" >same enum as</text><text x="1043.0" y="194" font-size="11" fill="#1A1A1A" font-weight="500" text-anchor="middle" style="font-family:'IBM Plex Mono',Menlo,monospace" >the USB path</text><rect x="32" y="236" width="526" height="6" rx="3" fill="#F05A28"/><text x="32" y="268" font-size="12" fill="#F05A28" font-weight="800" text-anchor="start" style="font-family:Barlow,'Helvetica Neue',Arial,sans-serif" >ON THE MIC (MicroPython, 64 KB heap)</text><rect x="576" y="236" width="526" height="6" rx="3" fill="#1A1A1A"/><text x="576" y="268" font-size="12" fill="#1A1A1A" font-weight="800" text-anchor="start" style="font-family:Barlow,'Helvetica Neue',Arial,sans-serif" >ON THE MAC (Swift app)</text><circle r="7" fill="#E3242B"><animateMotion dur="4s" repeatCount="indefinite" path="M91.0 104 H1043.0" keyTimes="0;1" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="4s" repeatCount="indefinite"/></circle><text x="32" y="306" font-size="13" fill="#8C8C88" font-weight="500" text-anchor="start" style="font-family:Barlow,'Helvetica Neue',Arial,sans-serif" >The voice travels on the same wire: the app cuts the take between the “handle down” and “handle up” codes.</text></svg>
