<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" width="1120" height="300" role="img" aria-label="Latency budget"><title>Latency budget</title><rect width="1120" height="300" rx="14" fill="#EDEDE8"/><text x="32" y="44" font-size="20" fill="#1A1A1A" font-weight="800" text-anchor="start" style="font-family:Barlow,'Helvetica Neue',Arial,sans-serif" >Where the time goes (estimate from the timings, not a measurement)</text><text x="32" y="90" font-size="14" fill="#1A1A1A" font-weight="700" text-anchor="start" style="font-family:Barlow,'Helvetica Neue',Arial,sans-serif" >v1: 60 ms symbols, wait for silence</text><rect x="32" y="100" width="49.2" height="34" rx="5" fill="#8C8C88"/><text x="57.6" y="122" font-size="11" fill="#fff" font-weight="700" text-anchor="middle" style="font-family:'IBM Plex Mono',Menlo,monospace" >tick</text><rect x="83.2" y="100" width="190.0" height="34" rx="5" fill="#F05A28"/><text x="179.2" y="122" font-size="11" fill="#fff" font-weight="700" text-anchor="middle" style="font-family:'IBM Plex Mono',Menlo,monospace" >S</text><rect x="275.2" y="100" width="190.0" height="34" rx="5" fill="#2F7DA8"/><text x="371.2" y="122" font-size="11" fill="#fff" font-weight="700" text-anchor="middle" style="font-family:'IBM Plex Mono',Menlo,monospace" >S</text><rect x="467.2" y="100" width="190.0" height="34" rx="5" fill="#5F8F2A"/><text x="563.2" y="122" font-size="11" fill="#fff" font-weight="700" text-anchor="middle" style="font-family:'IBM Plex Mono',Menlo,monospace" >S</text><rect x="659.2" y="100" width="94.0" height="34" rx="5" fill="#E3242B"/><text x="707.2" y="122" font-size="11" fill="#fff" font-weight="700" text-anchor="middle" style="font-family:'IBM Plex Mono',Menlo,monospace" >quiet</text><rect x="755.2" y="100" width="65.2" height="34" rx="5" fill="#1A1A1A"/><text x="788.8000000000001" y="122" font-size="11" fill="#fff" font-weight="700" text-anchor="middle" style="font-family:'IBM Plex Mono',Menlo,monospace" >tap+main</text><text x="834.4000000000001" y="123" font-size="16" fill="#1A1A1A" font-weight="800" text-anchor="start" style="font-family:'IBM Plex Mono',Menlo,monospace" >≈ 247 ms</text><text x="32" y="170" font-size="14" fill="#1A1A1A" font-weight="700" text-anchor="start" style="font-family:Barlow,'Helvetica Neue',Arial,sans-serif" >now: 40 ms symbols, early delivery</text><rect x="32" y="180" width="49.2" height="34" rx="5" fill="#8C8C88"/><text x="57.6" y="202" font-size="11" fill="#fff" font-weight="700" text-anchor="middle" style="font-family:'IBM Plex Mono',Menlo,monospace" >tick</text><rect x="83.2" y="180" width="126.0" height="34" rx="5" fill="#F05A28"/><text x="147.2" y="202" font-size="11" fill="#fff" font-weight="700" text-anchor="middle" style="font-family:'IBM Plex Mono',Menlo,monospace" >S</text><rect x="211.2" y="180" width="126.0" height="34" rx="5" fill="#2F7DA8"/><text x="275.2" y="202" font-size="11" fill="#fff" font-weight="700" text-anchor="middle" style="font-family:'IBM Plex Mono',Menlo,monospace" >S</text><rect x="339.2" y="180" width="126.0" height="34" rx="5" fill="#5F8F2A"/><text x="403.2" y="202" font-size="11" fill="#fff" font-weight="700" text-anchor="middle" style="font-family:'IBM Plex Mono',Menlo,monospace" >S</text><rect x="467.2" y="180" width="65.2" height="34" rx="5" fill="#1A1A1A"/><text x="500.8" y="202" font-size="11" fill="#fff" font-weight="700" text-anchor="middle" style="font-family:'IBM Plex Mono',Menlo,monospace" >tap+main</text><text x="546.4" y="203" font-size="16" fill="#1A1A1A" font-weight="800" text-anchor="start" style="font-family:'IBM Plex Mono',Menlo,monospace" >≈ 157 ms</text><text x="32" y="256" font-size="12" fill="#8C8C88" font-weight="500" text-anchor="start" style="font-family:Barlow,'Helvetica Neue',Arial,sans-serif" >tick = the firmware reacts on its next 16 ms tick; tap+main = one 1024-sample audio buffer at 48 kHz plus the hop to the main thread.</text><text x="32" y="276" font-size="12" fill="#8C8C88" font-weight="500" text-anchor="start" style="font-family:Barlow,'Helvetica Neue',Arial,sans-serif" >v1 waited for two quiet windows after the code; now the last symbol is accepted after two stable windows (110 ms after the onset in the animation).</text></svg>
