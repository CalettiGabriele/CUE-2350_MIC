<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" width="1120" height="300" role="img" aria-label="Message timeline"><title>Message timeline</title><rect width="1120" height="300" rx="14" fill="#EDEDE8"/><text x="32" y="44" font-size="22" fill="#1A1A1A" font-weight="800" text-anchor="start" style="font-family:Barlow,'Helvetica Neue',Arial,sans-serif" >One message on the wire: tap.orange</text><text x="32" y="70" font-size="14" fill="#8C8C88" font-weight="600" text-anchor="start" style="font-family:Barlow,'Helvetica Neue',Arial,sans-serif" >Three symbols of 40 ms, then 50 ms of silence before the next code may start.</text><rect x="60.0" y="120" width="182.0" height="70" rx="6" fill="#5F8F2A"/><text x="152.0" y="152" font-size="18" fill="#fff" font-weight="800" text-anchor="middle" style="font-family:'IBM Plex Mono',Menlo,monospace" >S2</text><text x="152.0" y="174" font-size="12" fill="#fff" font-weight="600" text-anchor="middle" style="font-family:'IBM Plex Mono',Menlo,monospace" >14+19 kHz</text><rect x="244.0" y="120" width="182.0" height="70" rx="6" fill="#F05A28"/><text x="336.0" y="152" font-size="18" fill="#fff" font-weight="800" text-anchor="middle" style="font-family:'IBM Plex Mono',Menlo,monospace" >S0</text><text x="336.0" y="174" font-size="12" fill="#fff" font-weight="600" text-anchor="middle" style="font-family:'IBM Plex Mono',Menlo,monospace" >12+15 kHz</text><rect x="428.0" y="120" width="182.0" height="70" rx="6" fill="#8E5BA8"/><text x="520.0" y="152" font-size="18" fill="#fff" font-weight="800" text-anchor="middle" style="font-family:'IBM Plex Mono',Menlo,monospace" >S3</text><text x="520.0" y="174" font-size="12" fill="#fff" font-weight="600" text-anchor="middle" style="font-family:'IBM Plex Mono',Menlo,monospace" >16+18 kHz</text><rect x="612.0" y="120" width="229.99999999999997" height="70" rx="6" fill="none" stroke="#8C8C88" stroke-dasharray="5 5"/><text x="727.0" y="160" font-size="14" fill="#8C8C88" font-weight="700" text-anchor="middle" style="font-family:'IBM Plex Mono',Menlo,monospace" >gap</text><line x1="60" y1="216" x2="841.9999999999999" y2="216" stroke="#1A1A1A"/><line x1="60.0" y1="216" x2="60.0" y2="224" stroke="#1A1A1A"/><text x="60.0" y="242" font-size="12" fill="#1A1A1A" font-weight="500" text-anchor="middle" style="font-family:'IBM Plex Mono',Menlo,monospace" >0 ms</text><line x1="106.0" y1="216" x2="106.0" y2="220" stroke="#1A1A1A"/><line x1="152.0" y1="216" x2="152.0" y2="220" stroke="#1A1A1A"/><line x1="198.0" y1="216" x2="198.0" y2="220" stroke="#1A1A1A"/><line x1="244.0" y1="216" x2="244.0" y2="224" stroke="#1A1A1A"/><text x="244.0" y="242" font-size="12" fill="#1A1A1A" font-weight="500" text-anchor="middle" style="font-family:'IBM Plex Mono',Menlo,monospace" >40 ms</text><line x1="290.0" y1="216" x2="290.0" y2="220" stroke="#1A1A1A"/><line x1="336.0" y1="216" x2="336.0" y2="220" stroke="#1A1A1A"/><line x1="382.0" y1="216" x2="382.0" y2="220" stroke="#1A1A1A"/><line x1="428.0" y1="216" x2="428.0" y2="224" stroke="#1A1A1A"/><text x="428.0" y="242" font-size="12" fill="#1A1A1A" font-weight="500" text-anchor="middle" style="font-family:'IBM Plex Mono',Menlo,monospace" >80 ms</text><line x1="473.99999999999994" y1="216" x2="473.99999999999994" y2="220" stroke="#1A1A1A"/><line x1="520.0" y1="216" x2="520.0" y2="220" stroke="#1A1A1A"/><line x1="566.0" y1="216" x2="566.0" y2="220" stroke="#1A1A1A"/><line x1="612.0" y1="216" x2="612.0" y2="224" stroke="#1A1A1A"/><text x="612.0" y="242" font-size="12" fill="#1A1A1A" font-weight="500" text-anchor="middle" style="font-family:'IBM Plex Mono',Menlo,monospace" >120 ms</text><line x1="658.0" y1="216" x2="658.0" y2="220" stroke="#1A1A1A"/><line x1="704.0" y1="216" x2="704.0" y2="220" stroke="#1A1A1A"/><line x1="750.0" y1="216" x2="750.0" y2="220" stroke="#1A1A1A"/><line x1="796.0" y1="216" x2="796.0" y2="220" stroke="#1A1A1A"/><line x1="841.9999999999999" y1="216" x2="841.9999999999999" y2="224" stroke="#1A1A1A"/><text x="841.9999999999999" y="242" font-size="12" fill="#1A1A1A" font-weight="500" text-anchor="middle" style="font-family:'IBM Plex Mono',Menlo,monospace" >170 ms</text><text x="871.9999999999999" y="150" font-size="14" fill="#1A1A1A" font-weight="700" text-anchor="start" style="font-family:Barlow,'Helvetica Neue',Arial,sans-serif" >4 symbols, 3 per message,</text><text x="871.9999999999999" y="172" font-size="14" fill="#1A1A1A" font-weight="700" text-anchor="start" style="font-family:Barlow,'Helvetica Neue',Arial,sans-serif" >no two equal neighbours:</text><text x="871.9999999999999" y="194" font-size="14" fill="#1A1A1A" font-weight="700" text-anchor="start" style="font-family:Barlow,'Helvetica Neue',Arial,sans-serif" >4 × 3 × 3 = 36 words,</text><text x="871.9999999999999" y="216" font-size="14" fill="#1A1A1A" font-weight="700" text-anchor="start" style="font-family:Barlow,'Helvetica Neue',Arial,sans-serif" >19 in use.</text><text x="32" y="280" font-size="13" fill="#8C8C88" font-weight="500" text-anchor="start" style="font-family:Barlow,'Helvetica Neue',Arial,sans-serif" >Equal neighbours are banned because the sampler retriggers the same slot without a gap: S1 S1 would sound like one long S1.</text></svg>
