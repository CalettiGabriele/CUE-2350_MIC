<script>
  (function () {

    const tl = gsap.timeline({ paused: true });
    const RED_ON = { fill: "#E3242B", filter: "drop-shadow(0 0 6px #FF3B30)" }, RED_OFF = { fill: "#5B2B28", filter: "none" };
    const WHITE_ON = { fill: "#FFFFFF", filter: "drop-shadow(0 0 6px #FFFFFF)" }, WHITE_OFF = { fill: "#6E6E6A", filter: "none" };
    function red(dev, lit, t) { for (let i = 1; i <= 4; i++) tl.set(dev + " .r" + i, lit.includes(i) ? RED_ON : RED_OFF, t); }
    function white(dev, n, t) { for (let i = 1; i <= 4; i++) tl.set(dev + " .w" + i, (n >> (i - 1)) & 1 ? WHITE_ON : WHITE_OFF, t); }
    function press(sel, t) { tl.to(sel, { x: -10, duration: 0.07, ease: "power2.in" }, t).to(sel, { x: 0, duration: 0.3, ease: "power3.out" }, t + 0.09); }
    function typeOn(sel, t0, dur) {
      const el = document.querySelector(sel); const txt = el.textContent; el.textContent = "";
      const spans = [...txt].map((ch) => { const sp = document.createElement("span"); sp.textContent = ch; el.appendChild(sp); return sp; });
      spans.forEach((sp, i) => tl.fromTo(sp, { display: "none" }, { display: "inline", duration: 0.001 }, t0 + (dur * i) / spans.length));
    }
    function rise(sel, t, d = 0.5, y = 24) { tl.fromTo(sel, { opacity: 0, y }, { opacity: 1, y: 0, duration: d, ease: "power3.out" }, t); }


    const D = "#f06-modes-device";
    red(D, [], 0); white(D, 0, 0);
    tl.fromTo(D, { y: 300, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0);
    rise("#f06-modes-stage .f06-modes-chrome", 0, 0.3, 8);
    const LED_ON = { backgroundColor: "#E3242B", boxShadow: "0 0 10px #FF3B30" }, LED_OFF = { backgroundColor: "#5B2B28", boxShadow: "none" };
    function active(n, t) {
      for (let i = 1; i <= 4; i++) {
        const r = "#f06-modes-r" + i;
        tl.set(r + " .bar", { opacity: i === n ? 1 : 0 }, t);
        tl.set(r + " .led", i === n ? LED_ON : LED_OFF, t);
        tl.set(r + " .name", { color: i === n ? "#1A1A1A" : "#76766F" }, t);
      }
      red(D, [n], t);
      tl.set("#f06-modes-n", { textContent: String(n) }, t);
    }
    [0.45, 0.85, 1.25, 1.65].forEach((t, i) => { rise("#f06-modes-r" + (i + 1), t, 0.35, 16); active(i + 1, t); });
    tl.fromTo("#f06-modes-stage .f06-modes-callout", { x: 60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 2.05);
    [[2.3, 1], [2.87, 2]].forEach(([t, n]) => {
      press(D + " .fxd-btn-orange", t);
      tl.fromTo("#f06-modes-stage .f06-modes-callout .box", { scale: 0.9 }, { scale: 1, duration: 0.3, ease: "power3.out" }, t);
      active(n, t + 0.05);
    });

    window.__timelines["f06-modes"] = tl;
  })();
