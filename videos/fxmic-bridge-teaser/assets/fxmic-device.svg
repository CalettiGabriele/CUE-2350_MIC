  </g>
  <!-- LED column -->
  <rect x="316" y="44" width="30" height="258" rx="15" fill="#3A3A38"/>
  <circle class="fxd-led-red r1" cx="331" cy="66" r="8"/>
  <circle class="fxd-led-red r2" cx="331" cy="96" r="8"/>
  <circle class="fxd-led-red r3" cx="331" cy="126" r="8"/>
  <circle class="fxd-led-red r4" cx="331" cy="156" r="8"/>
