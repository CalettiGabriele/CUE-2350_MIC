<svg class="fxd" viewBox="-70 0 520 760" xmlns="http://www.w3.org/2000/svg">
  <!-- FX-MIC redrawn from scratch for FXMic Bridge (style homage, not a trace).
       Animatable hooks (classes, no ids — safe to inline in several frames):
       .fxd-handle  lever behind the body (rotate around its lower pivot)
       .fxd-led-red.r1..r4   red LEDs (mode / KITT)     add .on to light
       .fxd-led-white.w1..w4 white LEDs (slot, binary)  add .on to light
       .fxd-btn-orange / .fxd-btn-white / .fxd-btn-grey  side buttons -->
  <style>
    .fxd .ink{stroke:#1A1A1A;stroke-width:3;stroke-linejoin:round}
    .fxd-led-red{fill:#5B2B28}
    .fxd-led-red.on{fill:#E3242B;filter:drop-shadow(0 0 6px #FF3B30)}
    .fxd-led-white{fill:#6E6E6A}
    .fxd-led-white.on{fill:#FFFFFF;filter:drop-shadow(0 0 6px #FFFFFF)}
  </style>
  <!-- handle / lever -->
  <g class="fxd-handle" style="transform-origin:90px 250px">
    <rect class="ink" x="-46" y="46" width="132" height="214" rx="14" fill="#F05A28" transform="rotate(-12 20 150)"/>
  </g>
  <!-- curly cable -->
  <path class="ink" fill="none" stroke-width="5" stroke-linecap="round"
    d="M200 540 v18 c-40 0 -40 22 0 22 c40 0 40 22 0 22 c-40 0 -40 22 0 22 c40 0 40 22 0 22 c-40 0 -40 22 0 22 c40 0 40 22 0 22 c-40 0 -40 22 0 22 v40"/>
  <!-- side buttons (behind the body edge) -->
  <rect class="fxd-btn-orange ink" x="344" y="78" width="34" height="74" rx="8" fill="#F05A28"/>
  <rect class="fxd-btn-white ink" x="344" y="206" width="34" height="62" rx="8" fill="#F7F7F3"/>
  <rect class="fxd-btn-grey ink" x="344" y="392" width="34" height="62" rx="8" fill="#A3A39E"/>
  <!-- body -->
  <rect class="ink" x="40" y="20" width="320" height="520" rx="24" fill="#E6E6E1"/>
  <!-- grille panel -->
  <path class="ink" d="M64 20 H336 a24 24 0 0 1 24 24 V318 H40 V44 a24 24 0 0 1 24 -24 Z" fill="#4E4E4B"/>
  <g fill="#2E2E2C">
    <!-- dot grille: 11 columns x 12 rows -->
