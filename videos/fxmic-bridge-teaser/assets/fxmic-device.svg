  <rect x="150" y="408" width="100" height="40" rx="6" fill="none" class="ink" stroke-width="2.5"/>
  <text x="200" y="434" text-anchor="middle" font-family="IBM Plex Mono" font-weight="600" font-size="15" letter-spacing="2" fill="#1A1A1A">BRIDGE</text>
