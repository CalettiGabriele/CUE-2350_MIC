name: macOS

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: app/scripts/test.sh
      - name: Build release
        working-directory: app
        run: xcrun swift build -c release
      - name: Verify bundle publication and failure recovery
        run: python3 app/scripts/test-bundle.py
